<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pac-Man</title>
  <!-- Arcade-style pixel font for the HUD. Each glyph is drawn on an 8x8 grid,
       the same size as one maze tile. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The arcade sign above the screen, built by marquee.js. Hidden until
       main.js finds room for it without shrinking the game. -->
  <header id="marquee" hidden></header>
  <!-- Width and height are set from constants.js so sizes live in one place -->
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <!-- Debug info is not part of the arcade screen, so it lives in HTML on top of it -->
    <div id="debug-overlay"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
